# ============================================
# REDDIS — Production Profile (Railway)
# ============================================

# --- PostgreSQL from Railway DATABASE_URL ---
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Thymeleaf ---
spring.thymeleaf.cache=true

# --- JWT (override secret in Railway env vars) ---
reddis.jwt.secret=${JWT_SECRET:ReddisProductionSecretKey2025MustBe256bits!!}
reddis.jwt.expiration=86400000

# --- Mail (console for now) ---
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# --- Server ---
server.port=${PORT:8080}
