# ============================================
# REDDIS — Production Profile (Railway + Supabase)
# ============================================

# --- PostgreSQL (Supabase) ---
# Set these in Railway environment variables:
#   DATABASE_HOST = aws-0-us-east-1.pooler.supabase.com  (or your region)
#   DATABASE_PORT = 6543                                   (transaction pooler)
#   DATABASE_NAME = postgres
#   DATABASE_USER = postgres.YOUR_PROJECT_REF
#   DATABASE_PASSWORD = your-supabase-db-password
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT:6543}/${DATABASE_NAME:postgres}?sslmode=require&prepareThreshold=0
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Connection Pool (optimized for Supabase) ---
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# --- Thymeleaf ---
spring.thymeleaf.cache=true

# --- JWT (override secret in Railway env vars) ---
reddis.jwt.secret=${JWT_SECRET:ReddisProductionSecretKey2025MustBe256bits!!}
reddis.jwt.expiration=86400000

# --- Mail (console for now) ---
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# --- Server ---
server.port=${PORT:8080}
