# Database — Supabase Pooler (sa-east-1, same pattern as AleIA)
spring.datasource.url=jdbc:postgresql://aws-1-sa-east-1.pooler.supabase.com:6543/postgres?pgbouncer=true&prepareThreshold=0
spring.datasource.username=postgres.rnyfzcikjavtodbxusiv
spring.datasource.password=${DATABASE_PASSWORD:4UdCyBpFWDf9G8zY}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=${PORT:8080}

# Thymeleaf
spring.thymeleaf.cache=true

# JWT
reddis.jwt.secret=${REDDIS_JWT_SECRET:ReddisSecretKeyForJWT2025MustBe256bits!!}
reddis.jwt.expiration=86400000

# Base URL for email confirmation links
reddis.base-url=${REDDIS_BASE_URL:http://localhost:5173}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB

# Mail — Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
reddis.mail.enabled=${MAIL_ENABLED:false}
