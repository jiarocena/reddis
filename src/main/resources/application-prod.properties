# ============================================
# REDDIS — Production (Railway)
# ============================================

# Database — use Supabase Connection Pooler for external access
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.username=${DATABASE_USERNAME:postgres.rnyfzcikjavtodbxusiv}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=${PORT:8080}

# Thymeleaf
spring.thymeleaf.cache=true

# JWT
reddis.jwt.secret=${REDDIS_JWT_SECRET:ReddisSecretKeyForJWT2025MustBe256bits!!}
reddis.jwt.expiration=86400000

# Base URL for email confirmation links
reddis.base-url=${RAILWAY_PUBLIC_DOMAIN:http://localhost:5173}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB
