# ============================================
# REDDIS — Production (Railway)
# ============================================

# Database — Railway PostgreSQL (auto-configured)
# Railway provides PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD
# We build the JDBC URL from those, or fall back to DATABASE_URL
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:postgres}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=${PORT:8080}

# Thymeleaf
spring.thymeleaf.cache=true

# JWT
reddis.jwt.secret=${REDDIS_JWT_SECRET:ReddisSecretKeyForJWT2025MustBe256bits!!}
reddis.jwt.expiration=86400000

# Base URL for email confirmation links
reddis.base-url=${RAILWAY_PUBLIC_DOMAIN:http://localhost:5173}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB
