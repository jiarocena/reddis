# --- Servidor ---
server.port=8080

# --- PostgreSQL (Supabase) ---
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://db.rnyfzcikjavtodbxusiv.supabase.co:5432/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:4UdCyBpFWDf9G8zY}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Connection Pool (Supabase optimized) ---
spring.datasource.hikari.maximum-pool-size=35
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=25000
spring.datasource.hikari.idle-timeout=300000

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# --- Thymeleaf ---
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# --- Seguridad: Sesión ---
server.servlet.session.timeout=30m

# --- Inicialización de datos ---
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# --- REDDIS JWT ---
reddis.jwt.secret=ReddisSecretKeyForJWT2025MustBe256bits!!
reddis.jwt.expiration=86400000

# --- Mail (console mode for pilot) ---
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# --- File Upload (for barrier photos) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB
