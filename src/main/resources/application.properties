# ============================================
# Sistema de Registro de Discapacidad - Uruguay
# ============================================

# --- Servidor ---
server.port=8080

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5433/registro_discapacidad
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# --- Thymeleaf ---
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# --- Seguridad: Sesión ---
server.servlet.session.timeout=30m

# --- Inicialización de datos ---
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# --- REDDIS JWT ---
reddis.jwt.secret=ReddisSecretKeyForJWT2025MustBe256bits!!
reddis.jwt.expiration=86400000

# --- Mail (console mode for pilot) ---
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
