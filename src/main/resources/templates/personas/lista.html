<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/layout :: head('Personas')}"></head>

<body class="d-flex flex-column min-vh-100">

    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="main-content">
        <div class="container py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="page-title"><i class="bi bi-people me-2"></i>Personas Registradas</h2>
                    <p class="page-subtitle">Listado de personas con discapacidad</p>
                </div>
                <a th:href="@{/personas/nuevo}" class="btn btn-primary">
                    <i class="bi bi-plus-lg me-1"></i> Nuevo Registro
                </a>
            </div>

            <!-- Search -->
            <div class="card mb-4">
                <div class="card-body py-3">
                    <form th:action="@{/personas}" method="get" class="d-flex gap-2">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input type="text" class="form-control" name="busqueda" th:value="${busqueda}"
                                placeholder="Buscar por cédula, nombre o apellido...">
                        </div>
                        <button type="submit" class="btn btn-primary">Buscar</button>
                        <a th:href="@{/personas}" class="btn btn-outline-secondary">Limpiar</a>
                    </form>
                </div>
            </div>

            <!-- Results -->
            <div class="card">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>Cédula</th>
                                    <th>Nombre Completo</th>
                                    <th>Departamento</th>
                                    <th>Celular</th>
                                    <th>F. Nacimiento</th>
                                    <th class="text-end">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="p : ${personas}">
                                    <td><strong th:text="${p.cedula}"></strong></td>
                                    <td th:text="${p.nombreCompleto}"></td>
                                    <td th:text="${p.departamento != null} ? ${p.departamento.nombre} : '-'"></td>
                                    <td th:text="${p.celular ?: '-'}"></td>
                                    <td th:text="${#temporals.format(p.fechaNacimiento, 'dd/MM/yyyy')}"></td>
                                    <td class="text-end">
                                        <a th:href="@{/personas/ver/{id}(id=${p.id})}"
                                            class="btn btn-sm btn-outline-info me-1" title="Ver detalle">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <a th:href="@{/personas/editar/{id}(id=${p.id})}"
                                            class="btn btn-sm btn-outline-primary me-1" title="Editar">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <a th:href="@{/personas/eliminar/{id}(id=${p.id})}"
                                            class="btn btn-sm btn-outline-danger"
                                            onclick="return confirm('¿Está seguro de eliminar este registro?')"
                                            title="Eliminar">
                                            <i class="bi bi-trash"></i>
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(personas)}">
                                    <td colspan="6" class="empty-state">
                                        <i class="bi bi-people d-block"></i>
                                        <p
                                            th:text="${busqueda != null} ? 'No se encontraron resultados para: ' + ${busqueda} : 'No hay personas registradas'">
                                        </p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        setTimeout(() => { document.querySelectorAll('.toast').forEach(t => new bootstrap.Toast(t, { delay: 100 }).hide()); }, 4000);
    </script>
</body>

</html>
