<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/layout :: head('Inicio')}"></head>

<body class="d-flex flex-column min-vh-100">

    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="main-content">
        <div class="container py-4">
            <!-- Welcome -->
            <div class="row mb-4">
                <div class="col">
                    <h2 class="page-title">
                        <i class="bi bi-house-door me-2"></i>Panel de Inicio
                    </h2>
                    <p class="page-subtitle">
                        Bienvenido/a, <strong th:text="${username}">usuario</strong>
                    </p>
                </div>
            </div>

            <!-- Stats -->
            <div class="row g-4 mb-4">
                <div class="col-md-4">
                    <div class="card stat-card">
                        <div class="stat-number" th:text="${totalPersonas}">0</div>
                        <div class="stat-label">Personas Registradas</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card stat-card accent">
                        <div class="stat-number" th:text="${totalUsuarios}">0</div>
                        <div class="stat-label">Usuarios del Sistema</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card stat-card warning">
                        <div class="stat-number">
                            <i class="bi bi-clipboard2-heart"></i>
                        </div>
                        <div class="stat-label">Sistema Activo</div>
                    </div>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="row g-4">
                <div class="col-md-6">
                    <div class="card h-100">
                        <div class="card-body text-center py-5">
                            <i class="bi bi-person-plus-fill text-primary" style="font-size: 3rem;"></i>
                            <h5 class="mt-3 mb-2">Registrar Nueva Persona</h5>
                            <p class="text-muted">Ingrese los datos de una nueva persona con discapacidad</p>
                            <a th:href="@{/personas/nuevo}" class="btn btn-primary">
                                <i class="bi bi-plus-lg me-1"></i> Nuevo Registro
                            </a>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card h-100">
                        <div class="card-body text-center py-5">
                            <i class="bi bi-search text-success" style="font-size: 3rem;"></i>
                            <h5 class="mt-3 mb-2">Buscar Personas</h5>
                            <p class="text-muted">Consulte el registro de personas por nombre o cédula</p>
                            <a th:href="@{/personas}" class="btn btn-success">
                                <i class="bi bi-list-ul me-1"></i> Ver Listado
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Auto-hide toasts after 4 seconds
        setTimeout(() => {
            document.querySelectorAll('.toast').forEach(t => {
                new bootstrap.Toast(t, { delay: 100 }).hide();
            });
        }, 4000);
    </script>
</body>

</html>
