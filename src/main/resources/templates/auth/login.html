<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema de Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>

    <div class="login-container">
        <div class="login-card card shadow-lg">
            <div class="login-header">
                <i class="bi bi-clipboard2-heart-fill d-block"></i>
                <h4 class="mb-1">Sistema de Registro</h4>
                <p class="mb-0 opacity-75" style="font-size: 0.9rem">Personas con Discapacidad - Uruguay</p>
            </div>
            <div class="login-body">
                <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span>Usuario o contraseña incorrectos</span>
                </div>
                <div th:if="${param.logout}" class="alert alert-info d-flex align-items-center" role="alert">
                    <i class="bi bi-info-circle-fill me-2"></i>
                    <span>Sesión cerrada correctamente</span>
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label" for="username">
                            <i class="bi bi-person me-1"></i> Usuario
                        </label>
                        <input type="text" id="username" name="username" class="form-control form-control-lg"
                            placeholder="Ingrese su usuario" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="password">
                            <i class="bi bi-lock me-1"></i> Contraseña
                        </label>
                        <input type="password" id="password" name="password" class="form-control form-control-lg"
                            placeholder="Ingrese su contraseña" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100">
                        <i class="bi bi-box-arrow-in-right me-2"></i> Iniciar Sesión
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
