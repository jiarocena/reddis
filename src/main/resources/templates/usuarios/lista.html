<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/layout :: head('Usuarios')}"></head>

<body class="d-flex flex-column min-vh-100">

    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="main-content">
        <div class="container py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="page-title"><i class="bi bi-gear me-2"></i>Gestión de Usuarios</h2>
                    <p class="page-subtitle">Administrar usuarios del sistema</p>
                </div>
                <a th:href="@{/usuarios/nuevo}" class="btn btn-primary">
                    <i class="bi bi-plus-lg me-1"></i> Nuevo Usuario
                </a>
            </div>

            <div class="card">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>Usuario</th>
                                    <th>Nombre Completo</th>
                                    <th>Email</th>
                                    <th>Rol</th>
                                    <th>Estado</th>
                                    <th class="text-end">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="u : ${usuarios}">
                                    <td>
                                        <i class="bi bi-person-circle me-1 text-muted"></i>
                                        <strong th:text="${u.username}"></strong>
                                    </td>
                                    <td th:text="${u.nombreCompleto}"></td>
                                    <td th:text="${u.email}"></td>
                                    <td>
                                        <span class="badge"
                                            th:classappend="${u.rol == 'ADMIN'} ? 'bg-danger' : (${u.rol == 'TECNICO'} ? 'bg-primary' : 'bg-secondary')"
                                            th:text="${u.rol}"></span>
                                    </td>
                                    <td>
                                        <span class="badge" th:classappend="${u.activo} ? 'bg-success' : 'bg-secondary'"
                                            th:text="${u.activo} ? 'Activo' : 'Inactivo'"></span>
                                    </td>
                                    <td class="text-end">
                                        <a th:href="@{/usuarios/editar/{id}(id=${u.id})}"
                                            class="btn btn-sm btn-outline-primary me-1">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <a th:href="@{/usuarios/eliminar/{id}(id=${u.id})}"
                                            class="btn btn-sm btn-outline-danger"
                                            onclick="return confirm('¿Está seguro de eliminar este usuario?')">
                                            <i class="bi bi-trash"></i>
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(usuarios)}">
                                    <td colspan="6" class="empty-state">
                                        <i class="bi bi-people d-block"></i>
                                        <p>No hay usuarios registrados</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        setTimeout(() => { document.querySelectorAll('.toast').forEach(t => new bootstrap.Toast(t, { delay: 100 }).hide()); }, 4000);
    </script>
</body>

</html>
